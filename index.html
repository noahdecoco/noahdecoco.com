<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noah Fernandes — Creative Technologist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <section id="landing-page">
        <div id="three-renderer"></div>

        <div id="title-panel">
          <p class="label">— portfolio</p>
          <h1>Noah<br />Fernandes</h1>
          <h2>Creative Coder</h2>
          <h3>
            <a href="mailto:noahdecoco@gmail.com">noahdecoco@gmail.com</a>
          </h3>
          <div class="hints">
            <p class="hint">use the mouse to move + interact</p>
            <p class="hint hint-keys">
              press [space] or [1-4] to switch channels
            </p>
            <p class="hint hint-touch">swipe to switch channels</p>
          </div>
        </div>

        <div id="osd" aria-live="polite">
          <p class="osd-number"></p>
          <p class="osd-name"></p>
        </div>

        <button
          id="menu-btn"
          aria-label="Open TV guide"
          aria-haspopup="dialog"
          aria-expanded="false"
        >
          Guide
        </button>

        <div
          id="guide-overlay"
          role="dialog"
          aria-modal="true"
          aria-label="TV guide"
          aria-hidden="true"
        >
          <div id="guide-panel">
            <p class="guide-title">TV Guide</p>
            <div id="guide-list"></div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
